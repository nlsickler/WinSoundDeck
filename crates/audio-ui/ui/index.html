<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio Mixer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="title-group">
      <h1>Audio Mixer</h1>
      <span id="daemon-badge" class="badge badge-offline">Connecting...</span>
    </div>
    <div class="topbar-actions">
      <button id="disconnected-btn" class="btn-role" title="Include disconnected audio devices">🔌 Disconnected</button>
      <button id="refresh-btn" class="btn-secondary" title="Refresh">Refresh</button>
    </div>
  </header>

  <section class="presets-bar" id="presets-section">
    <span class="presets-label">Presets</span>
    <div id="presets-list" class="presets-row"></div>
    <div id="preset-save-wrap" class="preset-save-wrap">
      <button id="preset-save-btn" class="btn-icon-action" title="Save preset">💾</button>
      <button id="preset-delete-btn" class="btn-icon-action btn-danger collapsed" title="Delete active preset">🗑️</button>
      <form id="preset-save-form" class="preset-save-form collapsed">
        <input id="preset-name-input" type="text" placeholder="Preset name..." maxlength="40" />
        <button type="submit" class="btn-icon-action" title="Confirm">✅</button>
        <button type="button" id="preset-cancel-btn" class="btn-icon-action" title="Cancel">❌</button>
      </form>
      <div id="preset-confirm-box" class="preset-confirm-box collapsed">
        <span id="preset-confirm-label" class="preset-confirm-label"></span>
        <button type="button" id="preset-confirm-yes" class="btn-icon-action" title="Confirm">✅</button>
        <button type="button" id="preset-confirm-no" class="btn-icon-action" title="Cancel">❌</button>
      </div>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="apps" role="tab" aria-selected="true">
      Applications <span id="count-apps" class="tab-count">0</span>
    </button>
    <button class="tab-btn" data-tab="io" role="tab" aria-selected="false">
      I/O <span id="count-io" class="tab-count">0</span>
    </button>
  </nav>

  <main class="container">
    <section class="tab-panel active" id="tab-apps" role="tabpanel">
      <div class="io-group">
        <h2>Active</h2>
        <div id="apps-active-list" class="card-list"></div>
      </div>
      <div class="io-group" id="apps-inactive-group">
        <h2 class="collapsible-heading" id="apps-inactive-toggle">
          <span class="chevron" id="apps-inactive-chevron">▸</span>
          Inactive <span id="apps-inactive-count" class="tab-count">0</span>
        </h2>
        <div id="apps-inactive-list" class="card-list collapsed"></div>
      </div>
    </section>

    <section class="tab-panel" id="tab-io" role="tabpanel">
      <div class="io-group">
        <h2>Outputs</h2>
        <div id="outputs-list" class="card-list"></div>
      </div>
      <div class="io-group">
        <h2>Inputs</h2>
        <div id="inputs-list" class="card-list"></div>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
