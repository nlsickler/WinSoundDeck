<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WinSoundDeck</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="title-group">
      <h1>WinSoundDeck</h1>
      <span id="daemon-badge" class="badge badge-offline collapsed" title="Daemon Offline">⚠️</span>
    </div>
    <div class="topbar-actions">
      <button id="refresh-btn" class="btn-secondary" title="Refresh">Refresh</button>
    </div>
  </header>

  <section class="presets-bar" id="presets-section">
    <span class="presets-label">Presets</span>
    <div id="presets-list" class="presets-row"></div>
    <div id="preset-save-wrap" class="preset-save-wrap">
      <button id="preset-save-btn" class="btn-icon-action" title="Save preset">💾</button>
      <button id="preset-delete-btn" class="btn-icon-action btn-danger collapsed" title="Delete active preset">🗑️</button>
      <form id="preset-save-form" class="preset-save-form collapsed">
        <input id="preset-name-input" type="text" placeholder="Preset name..." maxlength="40" />
        <button type="submit" class="btn-icon-action" title="Confirm">✅</button>
        <button type="button" id="preset-cancel-btn" class="btn-icon-action" title="Cancel">❌</button>
      </form>
      <div id="preset-confirm-box" class="preset-confirm-box collapsed">
        <span id="preset-confirm-label" class="preset-confirm-label"></span>
        <button type="button" id="preset-confirm-yes" class="btn-icon-action" title="Confirm">✅</button>
        <button type="button" id="preset-confirm-no" class="btn-icon-action" title="Cancel">❌</button>
      </div>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="apps" role="tab" aria-selected="true" title="Applications">
      Apps <span id="count-apps" class="tab-count">0</span>
    </button>
    <button class="tab-btn" data-tab="devices" role="tab" aria-selected="false" title="Devices">
      Devices <span id="count-devices" class="tab-count">0</span>
    </button>
    <button class="tab-btn" data-tab="system" role="tab" aria-selected="false" title="System">
      Sys <span id="count-system" class="tab-count">0</span>
    </button>
    <button class="tab-btn tab-btn-right" data-tab="visibility" role="tab" aria-selected="false" title="I/O Visibility">
      I/O Vis.
    </button>
    <button class="tab-btn tab-btn-icon" data-tab="settings" role="tab" aria-selected="false" title="App Settings">
      ⚙️
    </button>
  </nav>

  <main class="container">
    <section class="tab-panel active" id="tab-apps" role="tabpanel">
      <div id="apps-active-list" class="card-list"></div>
    </section>

    <section class="tab-panel" id="tab-devices" role="tabpanel">
      <div id="devices-list" class="card-list"></div>
    </section>

    <section class="tab-panel" id="tab-system" role="tabpanel">
      <div class="io-group">
        <h2>Outputs</h2>
        <div id="outputs-list" class="card-list"></div>
      </div>
      <div class="io-group">
        <h2>Inputs</h2>
        <div id="inputs-list" class="card-list"></div>
      </div>
    </section>

    <section class="tab-panel" id="tab-visibility" role="tabpanel">
      <div class="visibility-header">
        <h2>Device Visibility</h2>
        <div class="visibility-subtabs">
          <button class="subtab-btn active" data-subtab="outputs">Outputs</button>
          <button class="subtab-btn" data-subtab="inputs">Inputs</button>
        </div>
      </div>
      <div id="visibility-outputs-list" class="card-list"></div>
      <div id="visibility-inputs-list" class="card-list collapsed"></div>
    </section>

    <section class="tab-panel" id="tab-settings" role="tabpanel">
      <div class="io-group">
        <h2>App Settings</h2>
        <div class="card-list">
          <label class="settings-row">
            <div class="settings-row-text">
              <span class="card-title">Launch at Windows login</span>
              <span class="settings-desc">Start WinSoundDeck automatically when you sign in to Windows.</span>
            </div>
            <input id="launch-at-login-cb" class="toggle-switch" type="checkbox" />
          </label>
        </div>
      </div>
    </section>
  </main>

  <div id="filter-fab-wrap" class="filter-fab-wrap">
    <div id="filter-popover" class="filter-popover collapsed" role="dialog" aria-label="Filters">
      <div class="filter-popover-title">Filters</div>
      <label class="filter-option" data-filter-tabs="apps">
        <input id="filter-apps-idle-cb" type="checkbox" />
        <span>Idle Apps <span id="filter-apps-idle-count" class="tab-count">0</span></span>
      </label>
      <label class="filter-option" data-filter-tabs="apps">
        <input id="filter-apps-offline-cb" type="checkbox" />
        <span>Offline Apps <span id="filter-apps-offline-count" class="tab-count">0</span></span>
      </label>
      <label class="filter-option" data-filter-tabs="devices">
        <input id="filter-devices-idle-cb" type="checkbox" />
        <span>Idle Apps <span id="filter-devices-idle-count" class="tab-count">0</span></span>
      </label>
      <label class="filter-option" data-filter-tabs="devices">
        <input id="filter-devices-offline-cb" type="checkbox" />
        <span>Offline Apps <span id="filter-devices-offline-count" class="tab-count">0</span></span>
      </label>
      <label class="filter-option" data-filter-tabs="apps devices system">
        <input id="filter-disconnected-cb" type="checkbox" />
        <span>Disconnected Devices</span>
      </label>
      <div class="filter-actions" data-filter-tabs="apps">
        <button id="apps-clear-unpinned-btn" class="btn-clear-unpinned" title="Clear unpinned offline apps">Clear Unpinned</button>
      </div>
    </div>
    <button id="filter-fab-btn" class="filter-fab-btn" title="Filters" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
      </svg>
      <span id="filter-fab-dot" class="filter-fab-dot collapsed"></span>
    </button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
