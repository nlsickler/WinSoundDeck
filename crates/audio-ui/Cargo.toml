[package]
name = "audio-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
audio-core = { path = "../audio-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
